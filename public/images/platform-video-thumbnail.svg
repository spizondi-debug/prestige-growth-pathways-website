<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="See Prestige Growth Pathways in Action">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A1B33"/>
      <stop offset="0.55" stop-color="#0D2340"/>
      <stop offset="1" stop-color="#122A57"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="720" x2="1280" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1E4FD8"/>
      <stop offset="1" stop-color="#0FB87A"/>
    </linearGradient>
    <linearGradient id="scrim" x1="0" y1="360" x2="0" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A1B33" stop-opacity="0"/>
      <stop offset="1" stop-color="#0A1B33" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="120" cy="110" r="260" fill="#1E4FD8" opacity="0.16"/>
  <circle cx="1180" cy="640" r="300" fill="#0FB87A" opacity="0.12"/>
  <rect x="0" y="0" width="1280" height="720" fill="url(#scrim)"/>
  <rect x="0" y="0" width="1280" height="6" fill="url(#accent)"/>

  <text x="640" y="250" text-anchor="middle" font-family="'DM Sans','Inter',Arial,sans-serif" font-size="24" font-weight="600" letter-spacing="3" fill="#37E2A5">PRESTIGE GROWTH PATHWAYS</text>

  <g>
    <circle cx="640" cy="360" r="62" fill="#FFFFFF"/>
    <circle cx="640" cy="360" r="62" fill="none" stroke="url(#accent)" stroke-width="4" opacity="0.9"/>
    <path d="M620 330 L672 360 L620 390 Z" fill="#1E4FD8"/>
  </g>

  <text x="640" y="510" text-anchor="middle" font-family="'DM Sans','Inter',Arial,sans-serif" font-size="52" font-weight="700" fill="#FFFFFF">See Prestige Growth Pathways in Action</text>
  <text x="640" y="560" text-anchor="middle" font-family="'DM Sans','Inter',Arial,sans-serif" font-size="26" font-weight="500" fill="#D7E0EE">Workforce intelligence. Skills development. Measurable growth.</text>
</svg>
